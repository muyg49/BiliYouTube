name: Publish Firefox

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to publish, for example 0.1.1'
        required: true
        type: string
  release:
    types: [published]
  push:
    branches:
      - 'release/0.2.4'

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.18.3

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Resolve release version
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "release" ]]; then
            VERSION="${{ github.event.release.tag_name }}"
            VERSION="${VERSION#v}"
          elif [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            VERSION="${{ inputs.version }}"
            VERSION="${VERSION#v}"
          else
            VERSION="0.2.4"
          fi

          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid version: $VERSION" >&2
            exit 1
          fi

          echo "Publishing Firefox version $VERSION"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Set package version for build
        run: |
          node - <<'NODE'
          const fs = require('node:fs')
          const packageJson = JSON.parse(fs.readFileSync('package.json', 'utf8'))
          packageJson.version = process.env.VERSION
          fs.writeFileSync('package.json', `${JSON.stringify(packageJson, null, 2)}\n`)
          NODE

      - name: Type check
        run: pnpm compile

      - name: Build Firefox package and source archive
        run: pnpm zip:firefox

      - name: Submit to Firefox Add-ons
        run: |
          pnpm wxt submit \
            --firefox-zip .output/*-firefox.zip \
            --firefox-sources-zip .output/*-sources.zip
        env:
          FIREFOX_EXTENSION_ID: biliyoutube@muyg49.github.io
          FIREFOX_JWT_ISSUER: ${{ secrets.FIREFOX_JWT_ISSUER }}
          FIREFOX_JWT_SECRET: ${{ secrets.FIREFOX_JWT_SECRET }}
